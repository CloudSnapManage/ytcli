[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytcli-tui"
version = "1.0.0"
description = "A keyboard-driven YouTube client and media player built for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Shrijan Paudel"}
]
dependencies = [
    "textual",
    "yt-dlp",
    "python-mpv",
]

[project.optional-dependencies]
thumbnails = [
    "pillow>=10.0.0",
]

[project.scripts]
ytcli = "main:main"

[project.urls]
Homepage = "https://github.com/CloudSnapManage/ytcli"
Repository = "https://github.com/CloudSnapManage/ytcli"

[tool.setuptools]
py-modules = ["config", "main", "player", "terminal_graphics", "ui", "yt_downloader"]
