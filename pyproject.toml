[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytcli"
version = "1.0.0"
description = "A keyboard-driven YouTube client and media player built for the terminal"
readme = "README.md"
authors = [
    { name = "Shrijan Paudel" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "textual>=0.50.0",
    "python-mpv>=1.0.5",
]

[project.optional-dependencies]
thumbnails = [
    "pillow>=10.0.0",
]

[project.scripts]
ytcli = "main:main"

[tool.setuptools]
py-modules = ["config", "main", "player", "terminal_graphics", "ui", "yt_downloader"]
